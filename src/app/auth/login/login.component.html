<div class="ctn container-fluid">
  <div class="row title-ctn">
    <div class="col-12 text-center">
      <h6 class="title" (click)="openHome()">{{ title }}</h6>
    </div>
  </div>
  <div class="content row align-items-start">
    <div class="col-12 col-md-6 mb-3">
      <div class="login-form p-3">
        <div class="heading row mb-3">
          <label>Sign In</label>
        </div>
        <div class="form-ctn row">
          <div class="mb-3">
            <form #userform="ngForm">
              <div *ngIf="!otpSent">
                <div class="mb-3">
                  <input
                    placeholder="Mobile Number"
                    type="number"
                    class="txt-input form-control"
                    id="mobileId"
                    [(ngModel)]="otpSendRequest.mobileNumber"
                    name="mobileNumber"
                    required
                    #mobileId="ngModel"
                  />
                  <div
                    *ngIf="mobileId.invalid && mobileId.touched"
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Phone can't be empty!
                  </div>

                  <div
                    *ngIf="mobileError"
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Invalid mobile number!
                  </div>
                </div>

                <!-- <div class="mb-3 form-check">
                  <input
                    type="checkbox"
                    class="check-box form-check-input"
                    id="rememberId"
                    name="rememeberme"
                    [(ngModel)]="rememberUser"
                  />
                  <label class="check-input form-check-label" for="rememberId"
                    >Remember me</label
                  >
                </div> -->

                <div>
                  <button
                    type="submit"
                    class="login-btn btn"
                    (click)="generateOtp()"
                    [disabled]="userform.invalid"
                  >
                    Sign in
                  </button>
                </div>

                <div>
                  <button
                    type="submit"
                    class="create-acc-btn btn"
                    (click)="goToSignUp()"
                  >
                    Create account
                  </button>
                </div>
              </div>

              <div *ngIf="otpSent && !otpChecked" class="otp-state">
                <div class="mb-3">
                  <div class="mb-3">
                    <input
                      placeholder="Name"
                      type="text"
                      class="txt-input form-control"
                      id="name"
                      [(ngModel)]="otpValidateRequest.userName"
                      name="name"
                      #userName="ngModel"
                    />
                    <div
                      *ngIf="userName.invalid && userName.touched"
                      class="invalid-error alert-danger"
                      role="alert"
                    >
                      Name can't be empty!
                    </div>
                  </div>

                  <input
                    placeholder="Otp"
                    type="text"
                    class="txt-input form-control"
                    id="otpId"
                    [(ngModel)]="otpValidateRequest.otp"
                    name="otp"
                    required
                    minlength="6"
                    maxlength="6"
                    #userOtp="ngModel"
                  />
                  <div
                    *ngIf="userOtp.invalid && userOtp.touched"
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Please provide Otp first!
                  </div>
                </div>

                <div>
                  <button
                    type="submit"
                    class="login-btn btn"
                    (click)="validateOtp()"
                    [disabled]="userform.invalid"
                  >
                    Submit
                  </button>
                </div>

                <div>
                  <button
                    type="submit"
                    class="create-acc-btn btn"
                    (click)="generateOtp()"
                  >
                    Resend OTP
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-6 text-center mb-3">
      <img
        src="https://firebasestorage.googleapis.com/v0/b/depano-ai.appspot.com/o/App%2Fsign-in.png?alt=media&token=af0dfd5b-04d4-427f-9c2d-f123e9ff2343"
        class="img img-fluid"
        alt="..."
      />
    </div>
  </div>
</div>
