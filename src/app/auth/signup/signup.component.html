<div class="ctn container-fluid">
  <div class="row title-ctn">
    <div class="col-12 text-center">
      <h6 class="title" (click)="openHome()">{{ title }}</h6>
    </div>
  </div>
  <div class="content row align-items-start">
    <div class="col-12 col-md-6 mb-3">
      <div class="signup-form p-3">
        <div class="heading row mb-3">
          <label>Sign Up</label>
        </div>
        <div class="row">
          <div class="mb-3">
            <form #signUpForm="ngForm">
              <div *ngIf="!otp">
                <div class="mb-3">
                  <input
                    placeholder="Name"
                    type="text"
                    class="txt-input form-control"
                    id="name"
                    [(ngModel)]="signUpUser.name"
                    name="name"
                    required
                    #userName="ngModel"
                  />
                  <div
                    *ngIf="userName.invalid && userName.touched"
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Name can't be empty!
                  </div>
                </div>

                <div class="mb-3">
                  <input
                    placeholder="Email"
                    type="email"
                    class="txt-input form-control"
                    id="emailId"
                    [(ngModel)]="signUpUser.email"
                    name="email"
                    required
                    #userId="ngModel"
                    (keyup)="checkEmail()"
                  />
                  <div
                    *ngIf="userId.invalid && userId.touched"
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Email can't be empty!
                  </div>

                  <div
                    *ngIf="emailError"
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Invalid email format!
                  </div>
                </div>

                <div class="mb-3">
                  <input
                    placeholder="Password"
                    type="password"
                    class="txt-input form-control"
                    id="passwordId"
                    [(ngModel)]="signUpUser.password"
                    name="password"
                    required
                    #userPass="ngModel"
                  />
                  <div
                    *ngIf="userPass.invalid && userPass.touched"
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Password can't be empty!
                  </div>
                </div>

                <div class="mb-3">
                  <input
                    placeholder="Confirm Password"
                    type="password"
                    class="txt-input form-control"
                    id="cnfrmPassId"
                    [(ngModel)]="confirmPassword"
                    name="confirm"
                    required
                    #userCnfrm="ngModel"
                  />
                  <div
                    *ngIf="
                      (userCnfrm.invalid && userCnfrm.touched) || cnfrmPassError
                    "
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Passwords don't match!
                  </div>
                </div>

                <div>
                  <button
                    type="submit"
                    class="login-btn btn"
                    (click)="generateOtp()"
                    [disabled]="signUpForm.invalid"
                  >
                    Verify
                  </button>
                </div>

                <div>
                  <button
                    type="submit"
                    class="create-acc-btn btn"
                    (click)="goToLogin()"
                  >
                    Already have an account ?
                  </button>
                </div>

                <div *ngIf="passError" class="pass-error" role="alert">
                  <p>
                    Password must be at least 8 characters long. Contains at
                    least:<br />
                    One lowercase letter, uppercase letter, digit & special
                    character.
                  </p>
                </div>
              </div>

              <div *ngIf="otp" class="otp-state">
                <div class="mb-3">
                  <input
                    placeholder="Otp"
                    type="text"
                    class="txt-input form-control"
                    id="otpId"
                    [(ngModel)]="signUpUser.otp"
                    name="otp"
                    required
                    minlength="6"
                    maxlength="6"
                    #userOtp="ngModel"
                  />
                  <div
                    *ngIf="userOtp.invalid && userOtp.touched"
                    class="invalid-error alert-danger"
                    role="alert"
                  >
                    Please provide Otp first!
                  </div>
                </div>

                <button
                  type="submit"
                  class="login-btn btn"
                  (click)="verifyOtp()"
                  [disabled]="signUpForm.invalid"
                >
                  Submit
                </button>

                <button
                  type="submit"
                  class="create-acc-btn btn"
                  (click)="generateOtp()"
                >
                  Resend OTP
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 text-center mb-3">
      <img
        src="https://firebasestorage.googleapis.com/v0/b/depano-ai.appspot.com/o/App%2Fsign-up.png?alt=media&token=69a0eef0-eaec-47db-abb7-20cc7514b9c9"
        class="img img-fluid"
        alt="..."
      />
    </div>
  </div>
</div>
