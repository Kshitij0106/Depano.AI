<div class="container mt-2">

  <div class="action-buttons mt-2">
    <button class="btn secondary" (click)="undoLastMask()" [disabled]="!drawnPaths.length">
      Undo Last
    </button>

    <button class="btn secondary" (click)="resetCanvas()">
      Reset
    </button>
  </div>

  <div class="canvas-wrapper ">
    <canvas #canvasEl class="canvas-style"></canvas>
  </div>


  <div *ngIf="drawMode" class="prompt-footer">
    <input
      type="text"
      [(ngModel)]="userPrompt"
      placeholder="Describe your edit (e.g., add sunglasses, remove background)..."
    />
    <button
      class="btn primary"
      [disabled]="!userPrompt.trim() || !drawnPaths.length"
      (click)="generateImage()"
    >
      Generate Image
    </button>
  </div>
</div>
