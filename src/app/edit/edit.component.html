<app-header [source]="'edit'"></app-header>

<main class="page-wrapper">
  <div class="content-container">
    <div class="image-section">
      <img class="result-image img-fluid" [src]="image" alt="Result Image" />
    </div>

    <div class="user-input">
      <app-user-input
        [label]="label"
        [hideUserPrompt]="hideUserPrompt"
        (userInput)="inputSelected($event)"
      ></app-user-input>
    </div>
  </div>
</main>
