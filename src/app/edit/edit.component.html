<app-header [source]="'edit'"></app-header>

<main class="page-wrapper">
  <div class="content-container">
    <div class="edit-header" *ngIf="this.design">
      <h1 class="edit-title">Refine Your Design!</h1>
    </div>

    <div *ngIf="this.design" class="row mb-3">
      <div class="col-12 d-flex justify-content-center mb-2">
        <div class="action-buttons">
          <button type="button" class="action-btn" (click)="downloadDesign()">
            <lucide-icon class="icon" name="download"></lucide-icon>
            <span>Download</span>
          </button>

          <button type="button" class="action-btn" (click)="shareDesign()">
            <lucide-icon name="share-2"></lucide-icon>
            <span>Share</span>
          </button>

          <button type="button" class="action-btn" (click)="openMode()">
            <lucide-icon name="repeat-2"></lucide-icon>
            <span>Start Again</span>
          </button>
        </div>
      </div>
    </div>

    <div class="design-section">
      <img class="design-cnt img-fluid" [src]="design" />
    </div>

    <div *ngIf="this.design" class="user-input">
      <app-user-input
        [label]="label"
        [hideUserPrompt]="hideUserPrompt"
        (userInput)="inputSelected($event)"
      ></app-user-input>
    </div>
  </div>
</main>
