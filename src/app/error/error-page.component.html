<div class="error-container">
  <div class="error-content">
    <h1 class="error-title">{{ config.title }}</h1>
    <p class="error-subtitle">{{ config.subtitle }}</p>

    <div class="error-card">
      <div class="icon-container">
        <lucide-icon
          class="icon"
          [name]="config.icon"
          [size]="32"
        ></lucide-icon>
      </div>

      <p class="card-title">
        {{
          type === "SERVER_ERROR"
            ? "We're Working On It"
            : "Top Up Your Credits"
        }}
      </p>
      <p class="card-subtitle">
        {{
          type === "SERVER_ERROR"
            ? "Our team is working to resolve this issue."
            : "Continue creating amazing designs by adding more credits."
        }}
      </p>

      <!-- Tips -->
      <div *ngIf="config.tips" class="tips">
        <div *ngFor="let tip of config.tips; let i = index" class="tip">
          <span class="index">{{ i + 1 }}</span>
          {{ tip }}
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <!-- Row 1 -->
        <div class="action-row">
          <button
            *ngFor="let action of primaryActions"
            class="primary-btn"
            (click)="handleAction(action.action)"
          >
            <lucide-icon [name]="action.icon" [size]="18"></lucide-icon>
            {{ action.label }}
          </button>
        </div>

        <!-- Row 2 -->
        <div class="action-row-center" *ngIf="secondaryActions.length">
          <button
            *ngFor="let action of secondaryActions"
            class="tertiary-btn"
            (click)="handleAction(action.action)"
          >
            <lucide-icon [name]="action.icon" [size]="18"></lucide-icon>
            {{ action.label }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
