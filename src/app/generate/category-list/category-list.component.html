<div class="container-fluid">
  <div class="row row-cols-6 row-cols-sm-5 align-items-center">
    <ng-container *ngFor="let category of categoryList">
      <div class="card" (click)="selectCategory(category.code)">
        <div class="card-body">
          <img
            class="img"
            src="{{ category.image }}"
            height="150px"
            width="150px"
          />
          <h6 class="category-title">{{ category.name }}</h6>
        </div>
      </div>
    </ng-container>
  </div>
</div>
