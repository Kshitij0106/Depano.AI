<div class="container-fluid">
  <div class="row row-cols-5 row-cols-sm-5 align-items-center">
    <ng-container *ngFor="let category of categoryList | filter : searchKey">
      <div
        class="card"
        (click)="selectCategory(category.code, category.name, category.prompt)"
      >
        <div class="card-body">
          <img
            class="img"
            src="../../../assets/tshirt.png"
            [style.background-color]="category.code"
          />
          <h6 class="category-title">{{ category.name }}</h6>
        </div>
      </div>
    </ng-container>
  </div>
</div>
