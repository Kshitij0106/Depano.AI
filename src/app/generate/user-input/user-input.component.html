<div *ngIf="!hideUserPrompt">
  <div class="container-fluid">
    <h6 class="or">OR</h6>
  </div>
  <div class="container-fluid">
    <div class="form-floating">
      <textarea
        class="prompt-input form-control"
        placeholder="Add your own {{ categoryName }}"
        id="userInput"
        #userInputCategory
      ></textarea>
      <span>
        <button
          for="userInput"
          type="submit"
          class="btn"
          (click)="onSubmit(userInputCategory.value)"
        >
          Submit
        </button>
      </span>
    </div>
  </div>
</div>
