<div [ngStyle]="{ background: background }" class="cnt container-fluid">
  <div class="row d-flex justify-content-between align-items-center">
    <div class="col-12 col-md-10">
      <h6 class="title" (click)="openHome()">{{ title }}</h6>
    </div>

    <div
      *ngIf="showProfile"
      class="col-12 col-md-2 d-flex justify-content-md-end justify-content-center mt-2 mt-md-0"
    >
      <div class="btn-group">
        <button
          type="button"
          class="profile btn dropdown-toggle"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          {{ this.loggedInUser.name }}
          <i class="profile-icon fas fa-angle-down"></i>
        </button>
        <ul class="dropdown-menu">
          <li>
            <button class="dropdown-item" type="button">
              <i class="item-icon bi-person-circle"></i>
              <span class="item-text"
                >{{ this.loggedInUser.credits }} {{ "Credits" }}</span
              >
            </button>
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <button class="dropdown-item" type="button" (click)="logOut()">
              <i class="item-icon bi-box-arrow-left"></i>
              <span class="item-text">Log Out</span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
