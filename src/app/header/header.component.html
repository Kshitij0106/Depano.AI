<nav class="cnt navbar navbar-expand-lg">
  <div class="container-fluid">
    <div class="row w-100 align-items-center">
      <div class="logo-container col" (click)="openHome()">
        <div class="logo-icon">
          <i-lucide name="Sparkles" [size]="24" [strokeWidth]="2"></i-lucide>
        </div>
        <span class="logo-text">Depano AI</span>
      </div>

      <div
        *ngIf="showProfile"
        class="col-auto ms-auto d-flex align-items-center"
      >
        <div class="btn-group">
          <button
            type="button"
            class="profile btn dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            {{ getUsername(this.loggedInUser.userName) }}
            <lucide-icon
              class="profile-icon"
              name="chevron-down"
              [size]="18"
              [strokeWidth]="2"
            ></lucide-icon>
          </button>
          <ul class="dropdown-menu">
            <li>
              <button class="dropdown-item" type="button">
                <lucide-icon
                  class="item-icon"
                  name="circle-user-round"
                  [size]="20"
                  [strokeWidth]="2"
                ></lucide-icon>
                <span class="item-text"
                  >{{ this.loggedInUser.credits }} {{ "Credits" }}</span
                >
              </button>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button class="dropdown-item" type="button" (click)="logout()">
                <lucide-icon
                  class="item-icon"
                  name="log-out"
                  [size]="20"
                  [strokeWidth]="2"
                ></lucide-icon>
                <span class="item-text">Log Out</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
