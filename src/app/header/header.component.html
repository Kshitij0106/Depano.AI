<nav class="cnt navbar navbar-expand-lg">
  <div class="container-fluid">
    <div class="row w-100 align-items-center">
      <div class="logo-container col" (click)="openHome()">
        <div class="logo-icon">
          <i-lucide name="Sparkles" [size]="24"></i-lucide>
        </div>
        <span class="logo-text">Depano AI</span>
      </div>

      <div
        *ngIf="showProfile"
        class="col-auto ms-auto d-flex align-items-center"
      >
        <div class="btn-group">
          <button
            type="button"
            class="profile btn dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <span>{{ getUsername(loggedInUser.userName) }}</span>
            <lucide-icon
              class="profile-icon"
              name="chevron-down"
              [size]="18"
            ></lucide-icon>
          </button>

          <ul class="dropdown-menu dropdown-menu-custom">
            <li class="dropdown-header-section">
              <div class="user-profile-section">
                <div class="user-name">
                  {{ getUsername(loggedInUser.userName) }}
                </div>
              </div>
            </li>

            <li class="credits-section">
              <div class="credits-card" (click)="goToPricing()">
                <div class="credits-left">
                  <lucide-icon name="coins" [size]="20"></lucide-icon>
                  <div>
                    <div class="credits-title">Credits</div>
                    <div class="credits-sub">Click to top up</div>
                  </div>
                </div>
                <div class="credits-value">
                  {{ loggedInUser.credits }}
                </div>
              </div>
            </li>

            <li><hr class="dropdown-divider" /></li>

            <li class="dropdown-item-wrapper">
              <button
                class="dropdown-item logout-btn"
                type="button"
                (click)="logout()"
              >
                <lucide-icon name="log-out" [size]="16"></lucide-icon>
                Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
