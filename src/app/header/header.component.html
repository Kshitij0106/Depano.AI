<nav [ngStyle]="{ background: background }" class="cnt navbar navbar-expand-lg">
  <div class="container-fluid">
    <div class="row w-100 align-items-center">
      <div class="col">
        <h6 class="title" (click)="openHome()">{{ title }}</h6>
      </div>

      <div
        *ngIf="showProfile"
        class="col-auto ms-auto d-flex align-items-center"
      >
        <div class="btn-group">
          <button
            type="button"
            class="profile btn dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            {{ this.loggedInUser.userName }}
            <i class="profile-icon fas fa-angle-down"></i>
          </button>
          <ul class="dropdown-menu">
            <li>
              <button class="dropdown-item" type="button">
                <i class="item-icon bi-person-circle"></i>
                <span class="item-text"
                  >{{ this.loggedInUser.credits }} {{ "Credits" }}</span
                >
              </button>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button class="dropdown-item" type="button" (click)="logout()">
                <i class="item-icon bi-box-arrow-left"></i>
                <span class="item-text">Log Out</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
