<app-header [source]="'home'"></app-header>
<div class="ctn container-fluid">
  <div class="row home-cnt justify-content-center">
    <div class="col">
      <img
        src="https://firebasestorage.googleapis.com/v0/b/depano-ai.appspot.com/o/App%2Fhomepage.png?alt=media&token=651869ad-96b9-4d6d-9801-af36193d10ec"
        class="img"
        alt="..."
      />
      <div class="row overlay img-overlay">
        <div class="row">
          <p class="txt">Revolutionizing Fashion with AI</p>
        </div>
        <div class="row">
          <p class="description">
            Empowering Designers to Create, Innovate, and Inspire
          </p>
        </div>
        <div class="row btns">
          <button type="button" class="start-btn btn" (click)="getStarted()">
            Get started
          </button>
          <button type="button" class="info-btn btn">Learn more</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row content justify-content-center">
    <div class="about-component">
      <app-about></app-about>
    </div>
    <div class="home-component">
      <app-outputs></app-outputs>
    </div>
    <div class="home-component">
      <app-vision></app-vision>
    </div>
    <div class="home-component">
      <app-testimonials></app-testimonials>
    </div>
  </div>

  <div class="footer justify-content-center">
    <app-footer></app-footer>
  </div>
</div>
