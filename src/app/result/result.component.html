<app-header [source]="'result'"></app-header>
<div class="container container-fluid">
  <!-- Title Section -->
  <div class="result-header" *ngIf="this.image">
    <h1 class="result-title">Your Design is Ready!</h1>
  </div>

  <div *ngIf="this.image" class="row mb-3">
    <div class="col-12 d-flex justify-content-center mb-2">
      <div class="action-buttons">
        <button type="button" class="action-btn" (click)="downloadImage()">
          <lucide-icon class="icon" name="download"></lucide-icon>
          <span>Download</span>
        </button>

        <button type="button" class="action-btn" (click)="shareImage()">
          <lucide-icon name="share-2"></lucide-icon>
          <span>Share</span>
        </button>

        <button type="button" class="action-btn" (click)="openHome()">
          <lucide-icon name="repeat-2"></lucide-icon>
          <span>Start Again</span>
        </button>

        <button type="button" class="action-btn" (click)="editImage()">
          <lucide-icon name="square-pen"></lucide-icon>
          <span>Edit Image</span>
        </button>

        <button type="button" class="action-btn" (click)="regenerate()">
          <lucide-icon name="rotate-ccw"></lucide-icon>
          <span>Regenerate</span>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="this.image" class="row">
    <div class="col-12 d-flex justify-content-center align-items-center">
      <img class="img img-fluid" src="{{ image }}" />
    </div>
  </div>
</div>
