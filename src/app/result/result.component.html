<app-header [skip]="false"></app-header>
<div class="container">
  <button type="button" class="btn btn-outline-danger" (click)="openHome()">
    <i class="fa fa-retweet fa-xs" aria-hidden="true"></i>
    Start again
  </button>
  <button
    type="button"
    class="btn regen btn-outline-danger"
    (click)="sendRequest()"
  >
    <i class="fa fa-retweet fa-xs" aria-hidden="true"></i>
    Regenerate
  </button>
  <button type="button" class="btn share btn-outline-danger">
    <i class="fa fa-share-alt fa-xs" aria-hidden="true"></i>
    Share
  </button>
  <div class="resultCtn">
    <ng-container *ngFor="let image of images">
      <img class="img" src="{{ image }}" height="150px" width="150px" />
    </ng-container>
  </div>
</div>
