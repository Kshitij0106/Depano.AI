<app-header></app-header>
<div class="container">
  <button type="button" class="btn btn-outline-danger">
    <i class="fa fa-retweet fa-xs" aria-hidden="true"></i>
    Start again
  </button>
  <button type="button" class="btn regen btn-outline-danger">
    <i class="fa fa-retweet fa-xs" aria-hidden="true"></i>
    Regenerate
  </button>
  <button type="button" class="btn share btn-outline-danger">
    <i class="fa fa-share-alt fa-xs" aria-hidden="true"></i>
    Share
  </button>
  <div class="resultCtn">
    <ng-container *ngFor="let result of results">
      <img class="img" src="{{ result }}" height="150px" width="150px" />
    </ng-container>
  </div>
</div>
